<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SalaryPlan</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            background: #0A0F1A;
            color: white;
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0,180,216,0.1);
            border-top: 3px solid #00B4D8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        h1 { 
            background: linear-gradient(135deg, #00F5D4, #00B4D8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        p { color: #8A99B0; }
    </style>
</head>
<body>
    <h1>⚡ SalaryPlan</h1>
    <p>Loading your financial intelligence...</p>
    <div class="loader"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD5OB59lG6bAsmQ7A97zXP_MfQ5AM3BYaw",
            authDomain: "mindflow-ai-education.firebaseapp.com",
            projectId: "mindflow-ai-education"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let authCheckDone = false;

        auth.onAuthStateChanged(async (user) => {
            if (authCheckDone) return;
            
            if (!user) {
                authCheckDone = true;
                window.location.replace('/login.html');
                return;
            }
            
            try {
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    authCheckDone = true;
                    window.location.replace('/login.html');
                    return;
                }
                authCheckDone = true;
                
                // User is authenticated - load the full app
                document.body.innerHTML = `
                    <h1>✅ Welcome!</h1>
                    <p>Loading SalaryPlan dashboard...</p>
                    <div class="loader"></div>
                    <script>
                        // Load the real app here
                        console.log('User authenticated, loading app...');
                        // Add a fetch to check backend
                        fetch('https://salaryplan-api-v2.onrender.com/api/v1/health')
                            .then(r => r.json())
                            .then(data => {
                                console.log('Backend connected:', data);
                            });
                    <\/script>
                `;
                
            } catch (error) {
                console.error('❌ Auth error:', error);
                authCheckDone = true;
                window.location.replace('/login.html');
            }
        });
    </script>
</body>
</html>
