<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalaryPlan · Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Exo 2', sans-serif;
            background: #0A0F1A;
            color: #E8EDF5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: rgba(15, 25, 45, 0.45);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 180, 216, 0.2);
            border-radius: 28px;
            padding: 40px 32px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .login-logo {
            max-width: 220px;
            margin: 0 auto 20px;
            display: block;
            filter: drop-shadow(0 0 30px rgba(0,180,216,0.4));
        }
        .login-title {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00B4D8, #00F5D4);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .login-subtitle {
            font-size: 0.7rem;
            color: #8A99B0;
            letter-spacing: 2px;
            margin-bottom: 24px;
            font-family: monospace;
        }
        .btn-google {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 60px;
            background: #4285F4;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s;
        }
        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(66,133,244,0.5);
        }
        .login-error {
            color: #EF476F;
            font-size: 0.8rem;
            margin-top: 15px;
            min-height: 20px;
        }
        .login-footer {
            margin-top: 30px;
            font-size: 0.6rem;
            color: #4A5A6A;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="https://i.postimg.cc/xCd7skpy/ideogram-v3-0-3D-glass-logo-for-a-financial-tech-app-called-Salary-Plan-A-floating-glass-shie-0-rem.png" alt="SalaryPlan" class="login-logo" onerror="this.style.display='none'">
        <div class="login-title">SalaryPlan</div>
        <div class="login-subtitle">YOUR MONEY. YOUR PLAN. YOUR FUTURE.</div>

        <button class="btn-google" onclick="signInWithGoogle()">
            <i class="fab fa-google" style="font-size:1.3rem;"></i>
            Sign in with Google
        </button>

        <div id="loginError" class="login-error"></div>

        <div class="login-footer">
            ⚛️ CHSH S=2.76 · SA 2026/05142<br>
            © 2026 MindTech Industries
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD5OB59lG6bAsmQ7A97zXP_MfQ5AM3BYaw",
            authDomain: "mindflow-ai-education.firebaseapp.com",
            projectId: "mindflow-ai-education",
            storageBucket: "mindflow-ai-education.firebasestorage.app",
            messagingSenderId: "157615197603",
            appId: "1:157615197603:web:540d67781fc55d04c11e16"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function signInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            document.getElementById('loginError').textContent = '⏳ Signing in...';

            auth.signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    const userRef = db.collection('users').doc(user.uid);

                    return userRef.get().then((doc) => {
                        if (!doc.exists) {
                            const trialEnd = new Date();
                            trialEnd.setDate(trialEnd.getDate() + 7);
                            return userRef.set({
                                displayName: user.displayName,
                                email: user.email,
                                trialStart: new Date(),
                                trialEnd: trialEnd,
                                subscription: 'trial',
                                createdAt: new Date()
                            });
                        }
                    });
                })
                .then(() => {
                    window.location.replace('/index.html?v=2.1.0');
                })
                .catch((error) => {
                    document.getElementById('loginError').textContent = '❌ ' + error.message;
                });
        }

        auth.onAuthStateChanged((user) => {
            if (user) window.location.replace('/index.html?v=2.1.0');
        });
    </script>
</body>
</html>
