<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalaryPlan Login</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0F1A;
            color: #fff;
            font-family: -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: rgba(15, 25, 45, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 32px;
            padding: 50px 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00F5D4, #00B4D8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8A99B0;
            margin-bottom: 30px;
        }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-google:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(0,180,216,0.3);
        }
        .trial-badge {
            margin-top: 20px;
            padding: 8px 20px;
            border: 1px solid #00F5D4;
            border-radius: 50px;
            font-size: 0.75rem;
            color: #00F5D4;
            display: inline-block;
        }
        .quantum {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #5A6A80;
            font-family: monospace;
        }
        .quantum span { color: #00B4D8; font-weight: bold; }
        .error {
            background: rgba(239,71,111,0.2);
            border: 1px solid #EF476F;
            border-radius: 12px;
            padding: 12px;
            margin: 15px 0;
            color: #EF476F;
            display: none;
        }
        .loading {
            display: none;
            margin-top: 15px;
            color: #00F5D4;
        }
        .loading i { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>⚡ SalaryPlan</h1>
        <p class="subtitle">Your Financial Intelligence</p>
        
        <div id="errorMsg" class="error"></div>
        
        <button class="btn-google" id="googleBtn">
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 019.5 24c0-1.59.28-3.14.76-4.59l-7.98-6.19A23.99 23.99 0 000 24c0 3.77.87 7.35 2.56 10.56l7.97-6.16z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Continue with Google
        </button>
        
        <div class="loading" id="loadingIndicator">
            <i class="fas fa-spinner"></i> Authenticating...
        </div>
        
        <div class="trial-badge">
            ✨ 7-Day Free Trial
        </div>
        
        <div class="quantum">
            ⚛️ <span>CHSH S=2.76</span> · SA 2026/05142
        </div>
    </div>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyD5OB59lG6bAsmQ7A97zXP_MfQ5AM3BYaw",
            authDomain: "mindflow-ai-education.firebaseapp.com",
            projectId: "mindflow-ai-education"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const googleBtn = document.getElementById('googleBtn');
        const errorMsg = document.getElementById('errorMsg');
        const loadingIndicator = document.getElementById('loadingIndicator');
        let isProcessing = false;

        googleBtn.addEventListener('click', async () => {
            if (isProcessing) return;
            isProcessing = true;
            googleBtn.disabled = true;
            loadingIndicator.style.display = 'block';
            errorMsg.style.display = 'none';

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                console.log('✅ Logged in:', user.uid);

                // Check/create user profile
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    const trialEnd = new Date();
                    trialEnd.setDate(trialEnd.getDate() + 7);
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || user.email,
                        photoURL: user.photoURL || '',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        trialEnd: trialEnd,
                        trialActive: true,
                        subscriptionStatus: 'trial'
                    });
                    console.log('✅ New user profile created');
                }

                // Redirect to main app
                window.location.replace('/index.html');
            } catch (error) {
                console.error('❌ Login error:', error);
                errorMsg.textContent = '❌ ' + error.message;
                errorMsg.style.display = 'block';
                googleBtn.disabled = false;
                loadingIndicator.style.display = 'none';
                isProcessing = false;
            }
        });

        // Auto-redirect if already logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        window.location.replace('/index.html');
                    }
                } catch (e) {
                    console.error('Auth check error:', e);
                }
            }
        });

        console.log('💰 SalaryPlan Login Page Ready');
        console.log('⚛️ CHSH S=2.76 · SA 2026/05142');
    </script>
</body>
</html>
