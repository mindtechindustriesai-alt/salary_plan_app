<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalaryPlan Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js?v=2.0.1"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js?v=2.0.1"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js?v=2.0.1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #00B4D8;
            --secondary: #00F5D4;
            --dark: #0A0F1A;
            --glass: rgba(15, 25, 45, 0.25);
            --glass-border: rgba(0, 180, 216, 0.15);
            --glass-blur: 30px;
        }
        body {
            background: var(--dark);
            color: #E8EDF5;
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .login-box {
            position: relative;
            z-index: 1;
            background: var(--glass);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .login-box:hover {
            border-color: rgba(0, 180, 216, 0.3);
        }
        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .login-logo {
            max-width: 220px;
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 30px rgba(0, 180, 216, 0.3));
            animation: floatLogo 6s ease-in-out infinite;
            transition: all 0.3s;
        }
        .login-logo:hover {
            filter: drop-shadow(0 0 50px rgba(0, 180, 216, 0.5));
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #8A99B0;
            margin-bottom: 30px;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Exo 2', sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 180, 216, 0.3);
        }
        .btn-google:active { transform: scale(0.97); }
        .btn-google:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-google i { font-size: 1.2rem; }
        .trial-badge {
            margin-top: 22px;
            padding: 10px 24px;
            background: rgba(0, 255, 136, 0.12);
            border: 1px solid var(--secondary);
            border-radius: 50px;
            font-size: 0.8rem;
            color: var(--secondary);
            font-weight: 500;
            display: inline-block;
        }
        .trial-badge i { margin-right: 8px; }
        .quantum {
            margin-top: 22px;
            font-size: 0.7rem;
            color: #5A6A80;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
        }
        .quantum .chsh { color: var(--primary); font-weight: bold; }
        .quantum .patent { color: var(--secondary); font-weight: bold; }
        .africa {
            margin-top: 12px;
            font-size: 0.7rem;
            color: #5A6A80;
            letter-spacing: 0.5px;
        }
        .africa i { color: #FFD166; margin-right: 6px; }
        .error {
            background: rgba(239,71,111,0.15);
            border: 1px solid #EF476F;
            border-radius: 12px;
            padding: 12px;
            margin: 15px 0;
            color: #EF476F;
            display: none;
            font-size: 0.85rem;
        }
        .loading {
            display: none;
            margin-top: 16px;
            color: var(--secondary);
            font-size: 0.9rem;
        }
        .loading i { animation: spin 1s linear infinite; margin-right: 8px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .version {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 0.55rem;
            color: #4A5A70;
            background: rgba(0,0,0,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }
        @media (max-width: 480px) {
            .login-box { padding: 35px 20px; margin: 20px; }
            h1 { font-size: 1.8rem; }
            .login-logo { max-width: 160px; }
            .btn-google { font-size: 0.95rem; padding: 14px; }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="login-box">
        <div class="version">v2.0.1</div>
        
        <div class="logo-wrapper">
            <img src="https://i.postimg.cc/xCd7skpy/ideogram-v3-0-3D-glass-logo-for-a-financial-tech-app-called-Salary-Plan-A-floating-glass-shie-0-rem.png" alt="SalaryPlan" class="login-logo" id="mainLogo" onerror="this.src='https://i.postimg.cc/xCd7skpy/ideogram-v3-0-3D-glass-logo-for-a-financial-tech-app-called-Salary-Plan-A-floating-glass-shie-0-rem.png'">
        </div>
        
        <h1>SalaryPlan</h1>
        <p class="subtitle">Your Financial Intelligence</p>

        <div id="errorMsg" class="error"></div>

        <button class="btn-google" id="googleBtn">
            <i class="fab fa-google"></i> Continue with Google
        </button>

        <div class="loading" id="loadingIndicator">
            <i class="fas fa-spinner"></i> Authenticating...
        </div>

        <div class="trial-badge">
            <i class="fas fa-gem"></i> 7-Day Free Trial
        </div>

        <div class="quantum">
            ⚛️ <span class="chsh">CHSH S=2.76</span> · <span class="patent">SA 2026/05142</span>
        </div>

        <div class="africa">
            <i class="fas fa-globe-africa"></i> Built in Africa, for Africa
        </div>
    </div>

    <script>
        // ========== FIREBASE CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyD5OB59lG6bAsmQ7A97zXP_MfQ5AM3BYaw",
            authDomain: "mindflow-ai-education.firebaseapp.com",
            projectId: "mindflow-ai-education"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ========== DOM ELEMENTS ==========
        const googleBtn = document.getElementById('googleBtn');
        const errorMsg = document.getElementById('errorMsg');
        const loadingIndicator = document.getElementById('loadingIndicator');
        let isProcessing = false;

        // ========== CHROME FIX ==========
        // Force Chrome to use popup mode
        firebase.auth().settings.appVerificationDisabledForTesting = false;

        // ========== GOOGLE LOGIN ==========
        googleBtn.addEventListener('click', async () => {
            if (isProcessing) return;
            isProcessing = true;
            googleBtn.disabled = true;
            loadingIndicator.style.display = 'block';
            errorMsg.style.display = 'none';

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                console.log('✅ Logged in:', user.uid);

                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    const trialEnd = new Date();
                    trialEnd.setDate(trialEnd.getDate() + 7);
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || user.email,
                        photoURL: user.photoURL || '',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        trialEnd: trialEnd,
                        trialActive: true,
                        subscriptionStatus: 'trial'
                    });
                    console.log('✅ New user profile created');
                }

                // Force redirect with cache buster
                window.location.replace('/index.html?v=2.0.1');
            } catch (error) {
                console.error('❌ Login error:', error);
                if (error.code === 'auth/popup-blocked') {
                    errorMsg.textContent = '⚠️ Popup was blocked. Please allow popups for this site and try again.';
                } else {
                    errorMsg.textContent = '❌ ' + error.message;
                }
                errorMsg.style.display = 'block';
                googleBtn.disabled = false;
                loadingIndicator.style.display = 'none';
                isProcessing = false;
            }
        });

        // ========== AUTO-REDIRECT IF LOGGED IN ==========
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        window.location.replace('/index.html?v=2.0.1');
                    }
                } catch (e) {
                    console.error('Auth check error:', e);
                }
            }
        });

        // ========== PARTICLES ==========
        particlesJS('particles-js', {
            particles: {
                number: { value: 55 },
                color: { value: ["#00B4D8", "#00F5D4"] },
                shape: { type: "circle" },
                opacity: { value: 0.25, random: true },
                size: { value: 2.5, random: true },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: "#00B4D8",
                    opacity: 0.08
                },
                move: {
                    enable: true,
                    speed: 0.8,
                    direction: "none",
                    random: true,
                    straight: false,
                    out_mode: "out"
                }
            },
            interactivity: {
                events: {
                    onhover: { enable: true, mode: "repulse" }
                }
            }
        });

        console.log('💰 SalaryPlan Login v2.0.1');
        console.log('⚛️ CHSH S=2.76 · SA 2026/05142');
        console.log('🌍 Built in Africa, for Africa');
    </script>
</body>
</html>
