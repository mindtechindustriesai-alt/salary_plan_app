<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalaryPlan | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0F1A;
            color: #E8EDF5;
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: rgba(15, 25, 45, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 32px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        .logo {
            max-width: 160px;
            margin: 0 auto 20px;
            display: block;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00F5D4, #00B4D8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #8A99B0;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Exo 2', sans-serif;
        }
        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,180,216,0.3);
        }
        .trial-badge {
            margin-top: 20px;
            padding: 8px 20px;
            background: rgba(0,255,136,0.12);
            border: 1px solid #00F5D4;
            border-radius: 50px;
            font-size: 0.75rem;
            color: #00F5D4;
            display: inline-block;
        }
        .quantum {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #5A6A80;
            font-family: monospace;
        }
        .quantum span { color: #00B4D8; font-weight: bold; }
        .africa { margin-top: 10px; font-size: 0.7rem; color: #5A6A80; }
        .africa i { color: #FFD166; }
        .error {
            background: rgba(239,71,111,0.2);
            border: 1px solid #EF476F;
            border-radius: 12px;
            padding: 12px;
            margin: 15px 0;
            color: #EF476F;
            display: none;
            font-size: 0.85rem;
        }
        .loading {
            display: none;
            margin-top: 15px;
            color: #00F5D4;
        }
        .loading i { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="assets/logo/salaryplan-logo.png" alt="SalaryPlan" class="logo" onerror="this.src='https://i.postimg.cc/xCd7skpy/ideogram-v3-0-3D-glass-logo-for-a-financial-tech-app-called-Salary-Plan-A-floating-glass-shie-0-rem.png'">
        
        <h1>SalaryPlan</h1>
        <p class="subtitle">Your Financial Intelligence</p>
        
        <div id="errorMsg" class="error"></div>
        
        <button class="btn-google" id="googleBtn">
            <i class="fab fa-google"></i> Continue with Google
        </button>
        
        <div class="loading" id="loadingIndicator">
            <i class="fas fa-spinner"></i> Authenticating...
        </div>
        
        <div class="trial-badge">
            <i class="fas fa-gem"></i> 7-Day Free Trial
        </div>
        
        <div class="quantum">
            ⚛️ <span>CHSH S=2.76</span> · SA 2026/05142
        </div>
        
        <div class="africa">
            <i class="fas fa-globe-africa"></i> Built in Africa, for Africa
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD5OB59lG6bAsmQ7A97zXP_MfQ5AM3BYaw",
            authDomain: "mindflow-ai-education.firebaseapp.com",
            projectId: "mindflow-ai-education"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const googleBtn = document.getElementById('googleBtn');
        const errorMsg = document.getElementById('errorMsg');
        const loadingIndicator = document.getElementById('loadingIndicator');
        let isProcessing = false;

        googleBtn.addEventListener('click', async () => {
            if (isProcessing) return;
            isProcessing = true;
            googleBtn.disabled = true;
            loadingIndicator.style.display = 'block';
            errorMsg.style.display = 'none';

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                const userDoc = await db.collection('users').doc(user.uid).get();
                if (!userDoc.exists) {
                    const trialEnd = new Date();
                    trialEnd.setDate(trialEnd.getDate() + 7);
                    await db.collection('users').doc(user.uid).set({
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || user.email,
                        photoURL: user.photoURL || '',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        trialEnd: trialEnd,
                        trialActive: true,
                        subscriptionStatus: 'trial'
                    });
                }
                window.location.replace('/index.html');
            } catch (error) {
                errorMsg.textContent = 'Login failed: ' + error.message;
                errorMsg.style.display = 'block';
                googleBtn.disabled = false;
                loadingIndicator.style.display = 'none';
                isProcessing = false;
            }
        });

        // Auto-redirect if already logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        window.location.replace('/index.html');
                    }
                } catch (e) {}
            }
        });
    </script>
</body>
</html>
